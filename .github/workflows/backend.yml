name: Backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          # Packages hosted only on Emergent are not needed to check this code.
          grep -vE '^(emergentintegrations|litellm)' requirements.txt > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt" ruff==0.11.2
      - name: Check for syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 .
      - name: Load the application
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: agos_ci
          APP_NAME: agos-ci
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          STELLAR_NETWORK: TESTNET
        run: |
          export STELLAR_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python -c "from server import app; assert any(r.path == '/api/health' for r in app.routes); print(len(app.routes), 'routes loaded')"
